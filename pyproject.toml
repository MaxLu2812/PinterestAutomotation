[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinterest-agent"
version = "0.1.0"
description = "Pinterest aesthetic automation — generate and publish Pinterest-optimized images"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PinterestAutomotation", email = "dev@example.com" },
]
keywords = ["pinterest", "automation", "image-generation", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "click>=8.1",
    "aiosqlite>=0.19,<1.0",
    "Pillow>=10.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]
local = [
    "torch>=2.1",
    "torch-directml>=0.2",
    "diffusers>=0.24",
    "transformers>=4.36",
    "safetensors>=0.4",
]
publish = [
    "apscheduler>=3.10",
    "httpx>=0.25",
]

[project.scripts]
pinterest-agent = "pinterest_agent.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pinterest_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
markers = [
    "integration: tests that use real SQLite but mock external APIs",
    "e2e: end-to-end tests that exercise the full pipeline",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-select = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
